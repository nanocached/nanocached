# Dependabot version updates: one weekly pull request per ecosystem and
# directory when a dependency has a newer release, and security updates as
# soon as an advisory is published. Dependabot's alerts alone did not see
# the Gradle `api` declarations of the Spring adapters, so every manifest
# is named here; .github/workflows/dependency-audit.yaml runs the
# ecosystems' own scanners weekly on top of this.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /sdk/rust
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /tools/bulkbench
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
  # The Go SDK's development tools (staticcheck), kept out of its go.mod.
  - package-ecosystem: gomod
    directory: /sdk/go/tools
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /adapters/django
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /adapters/cache-manager
    schedule:
      interval: weekly
    ignore:
      # nanocached-cache-manager is a cache-manager v5 `Store` on purpose:
      # v6 and later dropped the Store interface for Keyv storage adapters,
      # which nanocached-keyv (adapters/keyv) provides. Patch and minor
      # updates of cache-manager 5.x are still proposed.
      - dependency-name: cache-manager
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /adapters/keyv
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /sdk/dotnet
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /adapters/dotnet
    schedule:
      interval: weekly
  # The .NET SDK pinned in global.json (CI and releases install exactly it).
  # The SDK's major follows the projects' target framework (net10.0, LTS), so
  # only patch and feature-band updates are proposed; moving to a later major
  # goes with a TargetFramework/AnalysisLevel change, on purpose.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: dotnet-sdk
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gradle
    directory: /sdk/java
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/spring
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/spring-boot-starter
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/jcache
    schedule:
      interval: weekly
  # The server's toolchain pinned in rust-toolchain.toml. The Rust SDK's MSRV
  # (1.88 in sdk/rust/Cargo.toml and ci.yaml) is a floor, not a pin: it stays
  # until it is raised on purpose.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The container images' base images (Dockerfile): an Alpine branch is
  # supported for two years, and 3.21 ran out on 2026-11-01 with nothing
  # here to say so.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
