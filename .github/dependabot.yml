# Dependabot version updates: one weekly pull request per ecosystem and
# directory when a dependency has a newer release, and security updates as
# soon as an advisory is published. Dependabot's alerts alone did not see
# the Gradle `api` declarations of the Spring adapters, so every manifest
# is named here; .github/workflows/dependency-audit.yaml runs the
# ecosystems' own scanners weekly on top of this.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /sdk/rust
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /tools/bulkbench
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /adapters/django
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /adapters/cache-manager
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /adapters/keyv
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /sdk/dotnet
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /adapters/dotnet
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /sdk/java
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/spring
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/spring-boot-starter
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/jcache
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
