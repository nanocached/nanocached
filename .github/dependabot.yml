# Dependabot version updates: one weekly pull request per ecosystem and
# directory when a dependency has a newer release, and security updates as
# soon as an advisory is published. Dependabot's alerts alone did not see
# the Gradle `api` declarations of the Spring adapters, so every manifest
# is named here; .github/workflows/dependency-audit.yaml runs the
# ecosystems' own scanners weekly on top of this.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /sdk/rust
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /tools/bulkbench
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /adapters/django
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /adapters/cache-manager
    schedule:
      interval: weekly
    ignore:
      # nanocached-cache-manager is a cache-manager v5 `Store` on purpose:
      # v6 and later dropped the Store interface for Keyv storage adapters,
      # which nanocached-keyv (adapters/keyv) provides. Patch and minor
      # updates of cache-manager 5.x are still proposed.
      - dependency-name: cache-manager
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /adapters/keyv
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /sdk/dotnet
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /adapters/dotnet
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /sdk/java
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/spring
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/spring-boot-starter
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /adapters/jcache
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The container images' base images (Dockerfile): an Alpine branch is
  # supported for two years, and 3.21 ran out on 2026-11-01 with nothing
  # here to say so.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
