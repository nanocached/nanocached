name: Chaos nightly

# tests/e2e/chaos.sh with every oracle on: R=2, three nodes, six rounds of
# join, decommission and kill-restart under mixed load, with the touch,
# delete, TTL, compare-and-set, INCR, namespace-clear and multi-set
# workloads each crossing those membership changes and every key read back
# from every live node. One run takes about 16 minutes on a laptop.
#
# Not per push. Every night three cells run on runners of their own (the load
# is timed against the membership change, and several clusters on one runner
# would share its CPU): an early warning, so a regression is looked at while
# the commits that could have caused it are few. Before a release of the node
# or discovery, run it by hand with `cells` set to 21 on the release commit:
# the failures the oracles found before a release showed in one run of six
# to nine, so a single pass says little and twenty-one clean runs are what the
# release criteria in tests/e2e/README.md ask for.
#
# A failing cell is a finding to look at, not noise: the oracles assert only
# behaviour the architecture page does not accept, and the accepted behaviour
# is printed in the job summary so its size can be followed from run to run.
#
# The node image is built with the `trace` cargo feature (src/trace.rs) and
# traces the serial INCR keys only (`NANOCACHED_TRACE_PREFIX=is`): chaos.sh
# counts the increments the nodes applied against the ones the loader saw
# acknowledged (tests/e2e/incrtrace.py), so an INCR answer the oracle cannot
# explain comes with the node-side evidence in the run's logs. Tracing more
# prefixes made cells fail on untraced keys (the output volume slows the
# membership changes); `is` alone ran clean. See tests/e2e/README.md.
#
# It reports; it does not gate release tagging.

on:
  schedule:
    # UTC; 00:23 in Japan.
    - cron: "23 15 * * *"
  workflow_dispatch:
    inputs:
      cells:
        description: "Number of chaos runs, one runner each (21 before a release)"
        default: "3"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - name: List the cells
        id: plan
        env:
          CELLS: ${{ inputs.cells }}
        run: |
          n="${CELLS:-3}"
          case "$n" in ''|*[!0-9]*) echo "cells must be a number, got '$n'" >&2; exit 1;; esac
          [ "$n" -ge 1 ] && [ "$n" -le 30 ] || { echo "cells must be 1 to 30, got $n" >&2; exit 1; }
          echo "runs=[$(seq 1 "$n" | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  chaos:
    needs: plan
    name: run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the node image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: node
          build-args: FEATURES=trace
          load: true
          tags: nanocached-node:chaos
          cache-from: type=gha,scope=node-trace
          cache-to: type=gha,mode=max,scope=node-trace

      - name: Build the discovery image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: discovery
          load: true
          tags: nanocached-discovery:chaos
          cache-from: type=gha,scope=discovery
          cache-to: type=gha,mode=max,scope=discovery

      # The loaders are Python scripts that import the SDK; the image is the
      # SDK of this commit, so a change to it is part of what runs.
      - name: Build the client image
        run: |
          docker build -t e2e-client:chaos -f - sdk/python <<'EOF'
          FROM python:3.12-slim
          COPY . /sdk
          RUN pip install --no-cache-dir /sdk
          WORKDIR /w
          EOF

      - name: Run chaos with every oracle
        # chaos.sh bounds its own waits; this is the outer bound for the step.
        env:
          NODE: nanocached-node:chaos
          DISC: nanocached-discovery:chaos
          CLIENT: e2e-client:chaos
          # Trace the serial INCR keys for incrtrace.py (see the header).
          NENV: "-e NANOCACHED_TRACE_PREFIX=is"
          ROUNDS: "6"
          RUN: ci${{ matrix.run }}
          DELETE_ORACLE: "1"
          TTL_ORACLE: "1"
          CAS_ORACLE: "1"
          INCR_ORACLE: "1"
          CLEAR_ORACLE: "1"
          MULTI_ORACLE: "1"
        run: |
          set -o pipefail
          timeout 3000 tests/e2e/chaos.sh 2>&1 | tee chaos.log

      - name: Summarise the run
        if: always()
        run: |
          {
            echo "### chaos run ${{ matrix.run }}"
            echo '```'
            grep -E "DONE|FAIL|^=== (check|discovery|incr trace|.* accepted)" chaos.log | cut -c1-700 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-${{ matrix.run }}
          path: |
            chaos.log
            tests/e2e/logs/chaos-ci${{ matrix.run }}/
          if-no-files-found: warn
          retention-days: 14
