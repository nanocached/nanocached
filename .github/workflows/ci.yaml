name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting and lints
        run: make check

      - name: Run tests
        run: make test

  typescript-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Build nanocached-node and nanocached-discovery
        run: cargo build --bin nanocached-node --bin nanocached-discovery

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Typecheck
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Run tests
        working-directory: sdk/typescript
        run: npm test
