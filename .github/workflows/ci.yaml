name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting and lints
        run: make check

      - name: Run tests
        run: make test
