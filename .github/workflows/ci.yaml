name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting and lints
        run: make check

      - name: Run tests
        run: make test

  typescript-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm's version comes from `packageManager` in this package.json
          # (there is no repo-root package.json for the action's default).
          package_json_file: sdk/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: sdk/typescript
        run: pnpm typecheck

      - name: Run tests
        working-directory: sdk/typescript
        run: pnpm test
