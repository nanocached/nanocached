name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting and lints
        run: make check

      - name: Run tests
        run: make test

  typescript-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm's version comes from `packageManager` in this package.json
          # (there is no repo-root package.json for the action's default).
          package_json_file: sdk/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: sdk/typescript
        run: pnpm typecheck

      - name: Run tests
        working-directory: sdk/typescript
        run: pnpm test

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: sdk/python
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -v

  java-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: sdk/java
        run: gradle test

  rust-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check formatting and lints
        working-directory: sdk/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D clippy::all

      - name: Run tests
        working-directory: sdk/rust
        run: cargo test --all-features

  dotnet-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        working-directory: sdk/dotnet
        run: dotnet test tests/Nanocached.Tests -v q

  go-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          # Stdlib-only module: there is no go.sum to key a cache on.
          cache: false

      - name: Check formatting and vet
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Run tests
        working-directory: sdk/go
        run: go test ./...
