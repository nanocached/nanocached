name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Check formatting and lints
        run: make check

      - name: Run tests
        run: make test

  typescript-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm's version comes from `packageManager` in this package.json
          # (there is no repo-root package.json for the action's default).
          package_json_file: sdk/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: sdk/typescript
        run: pnpm typecheck

      - name: Run tests
        working-directory: sdk/typescript
        run: pnpm test

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: sdk/python
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -v

  java-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run tests
        working-directory: sdk/java
        run: gradle test

  spring-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run tests
        working-directory: adapters/spring
        run: gradle test

  spring-boot-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run tests
        working-directory: adapters/spring-boot-starter
        run: gradle test

  jcache-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run tests
        working-directory: adapters/jcache
        run: gradle test

  dotnet-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        working-directory: adapters/dotnet
        run: dotnet test tests/Nanocached.Caching.Tests -v q --logger "console;verbosity=normal"

  django-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Django
        run: pip install "Django>=4.2"

      - name: Run tests
        working-directory: adapters/django
        env:
          PYTHONPATH: src:../../sdk/python/src
        run: python -m unittest discover -s tests -v

  cache-manager-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm's version comes from `packageManager` in the adapter's
          # package.json, same as the typescript-sdk job.
          package_json_file: adapters/cache-manager/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: adapters/cache-manager
        run: pnpm install

      - name: Typecheck
        working-directory: adapters/cache-manager
        run: pnpm typecheck

      - name: Run tests
        working-directory: adapters/cache-manager
        run: pnpm test

  keyv-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm's version comes from `packageManager` in the adapter's
          # package.json, same as the cache-manager-adapter job.
          package_json_file: adapters/keyv/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: adapters/keyv
        run: pnpm install

      - name: Typecheck
        working-directory: adapters/keyv
        run: pnpm typecheck

      - name: Run tests
        working-directory: adapters/keyv
        run: pnpm test

  rust-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check formatting and lints
        working-directory: sdk/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D clippy::all

      - name: Run tests
        working-directory: sdk/rust
        run: cargo test --all-features

      - name: Install MSRV toolchain (1.85.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (unreleased; no tags to pin instead)
        with:
          toolchain: 1.85.0

      # The repo-root `rust-toolchain.toml` pins 1.96, which shadows any
      # toolchain requested here unless overridden — without this, the
      # steps above never actually exercise the crate's declared
      # `rust-version = "1.85"` (Cargo.toml), so it could silently drift
      # from what's checked here.
      - name: Check MSRV compiles
        working-directory: sdk/rust
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo check --all-features

  dotnet-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        working-directory: sdk/dotnet
        run: dotnet test tests/Nanocached.Tests -v q --logger "console;verbosity=normal"

  go-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.23"
          # Stdlib-only module: there is no go.sum to key a cache on.
          cache: false

      - name: Check formatting and vet
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Run tests
        working-directory: sdk/go
        run: go test ./...

  staged-join-e2e:
    # Issue #448: the one job that runs the real `nanocached-discovery` and
    # `nanocached-node` binaries against each other. Every unit test on
    # either side talks to a mock of the other, so a wire-format change
    # that updates only one side (or only the mocks) stays green there —
    # issue #441 (an `M` frame the node could no longer parse, breaking
    # every staged join) sat on main for three days that way. The harness
    # spawns the binaries as subprocesses and drives a join, a serialized
    # double join, and a SIGTERM decommission end to end over raw TCP.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build the binaries the harness spawns
        run: cargo build --locked --bins

      - name: Staged join and decommission against real binaries
        # `timeout` is the outer watchdog; the harness bounds every wait
        # internally (JOIN_TIMEOUT etc.), this just guarantees the job
        # cannot hang past the inner bounds if one is ever missed.
        run: timeout 600 target/debug/verify-staged-join

      - name: Dump spawned process logs
        if: failure()
        run: |
          for f in "${TMPDIR:-/tmp}"/verify-staged-join-*/*; do
            echo "===== $f"
            tail -n 200 "$f"
          done

  e2e-scripts:
    # Lints the manual E2E scenario scripts under tests/e2e — it never runs
    # them (they need Docker, minutes-to-an-hour, netem). Just keeps them
    # syntactically valid and shellcheck-clean so they stay runnable by hand.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Shell syntax and shellcheck
        working-directory: tests/e2e
        run: |
          for f in *.sh; do bash -n "$f"; done
          # Excluded warnings are all intentional in these throwaway-cluster
          # scenario scripts: SC1091 (cl.sh sourced at runtime), SC2086 /
          # SC2046 (deliberate word-splitting of docker arg lists and
          # `$(docker ps -aq ...)` id lists), SC2155 (local x=$(...) in
          # one-liner helpers). Real errors (missing shebang, bad redirect
          # order, undefined-var typos) are still caught.
          shellcheck -e SC1091,SC2086,SC2046,SC2155 *.sh

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Python syntax
        working-directory: tests/e2e
        run: python -m py_compile *.py
