name: Hostile conformance

# All six SDKs against a fake node and a fake discovery server that misbehave
# (trickle, stall, oversize, a decompression bomb, write backpressure, a roster
# that is too large or unreachable): tools/conformance/scenarios.sh hostile
# runs each SDK's driver in a container of its own and
# tools/conformance/hostile_check.py judges time and peak memory against the one
# table in tools/conformance/fixtures/hostile_cases.json. The job fails when a
# cell is outside its bounds, so a cap removed from one SDK is found within a
# day and not at the next audit.
#
# Not per push: the six drivers are built first (npm, go, a JDK, dotnet, and a
# Rust build in a container) and the set runs for about ten minutes.
#
# It reports; it does not gate release tagging.

on:
  schedule:
    # UTC; 01:41 in Japan.
    - cron: "41 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostile:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdk/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Install the TypeScript SDK's dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Build the drivers
        run: tools/conformance/drivers/build.sh

      - name: Run the hostile set
        # scenarios.sh puts the whole run under its own watchdog (WATCHDOG,
        # 1500 s) and the driver's limit (LIMIT, 90 s) above every bound in the
        # table; this is the outer bound for the step. The fixtures and the
        # Python driver need nothing but `python` in their image.
        env:
          CLIENT: python:3.12-slim
          RUN: ci
        run: timeout 1700 tools/conformance/scenarios.sh hostile

      - name: Show the report
        if: always()
        run: |
          report=tools/conformance/results/ci/hostile/hostile_report.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "no report was written" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the run's records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-conformance
          path: tools/conformance/results/ci/
          if-no-files-found: warn
          retention-days: 14
