name: Hostile load

# The memory suite under tests/e2e/hostile: the real node, proxy and
# discovery binaries in Docker containers with a hard memory limit, driven
# by the inputs that once OOM-killed them. It fails if any is OOM-killed or
# its peak RSS passes a stated fraction of its limit.
#
# Not per push: it builds three images and runs for several minutes, and a
# Docker memory limit on a shared runner is noisier than a unit test. A
# nightly run (and a manual one) is enough to catch a new unbounded queue
# within a day instead of at the next audit.

on:
  schedule:
    # UTC; 01:13 in Japan.
    - cron: "13 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same build the release workflow does, loaded into the local
      # daemon instead of pushed.
      - name: Build the node image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: node
          load: true
          tags: nanocached-node:hostile

      - name: Build the discovery image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: discovery
          load: true
          tags: nanocached-discovery:hostile

      - name: Build the proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: proxy
          load: true
          tags: nanocached-proxy:hostile

      - name: Run the hostile-load scenarios
        # run.sh puts every scenario under its own watchdog; this is the
        # outer bound for the step.
        run: timeout 1800 tests/e2e/hostile/run.sh

      - name: Dump the scenario logs
        if: failure()
        run: |
          for f in tests/e2e/logs/hostile/*.log; do
            echo "===== $f"
            tail -n 200 "$f"
          done
