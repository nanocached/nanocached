name: Publish container image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# One publish at a time. This serialises the pushes; it does not order
# them — CI runs finish in their own order (and a re-run of an older
# commit's CI finishes last of all), so the "is this commit still the
# tip of main?" check below is what keeps `:main` from moving back.
concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        component: [node, discovery, proxy]

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:main` is the tip of main as of the last green CI run; `:sha-<id>`
      # pins one such build. `:latest` is the last release and is moved
      # only by the release workflow, for all three images at once.
      #
      # `:main` goes only on a build of the commit that is the tip of main
      # *now*, asked of the API at this moment rather than read from the
      # event: CI runs for consecutive commits can finish out of order,
      # and a re-run of an older commit's flaky CI finishes after the
      # newer commit was already published — both arrive here as a green
      # `push` run and would otherwise move `:main` back to the older
      # commit (#1165). A build of a commit that is no longer the tip gets
      # its `:sha-<id>` tag and nothing else.
      - name: Image tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.component }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
          tags="${IMAGE}:sha-${HEAD_SHA:0:12}"
          if [ "$tip" = "$HEAD_SHA" ]; then
            tags="${IMAGE}:main"$'\n'"$tags"
          else
            echo "::notice::${HEAD_SHA:0:12} is no longer the tip of main (${tip:0:12}); publishing :sha-${HEAD_SHA:0:12} only"
          fi
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
