name: Release SDK

# Also releases the seven framework adapters (`adapter/<name>/v*` tags).
# They live in this same workflow file on purpose: the registries' Trusted
# Publishing policies (nuget.org, PyPI, npm) are bound to the workflow
# file name, so one file keeps one policy per registry.
on:
  push:
    tags:
      - 'sdk/*/v*'
      - 'adapter/*/v*'

permissions:
  contents: read

jobs:
  rust:
    if: startsWith(github.ref_name, 'sdk/rust/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/rust/v}"
          grep -q "^version = \"$ver\"$" sdk/rust/Cargo.toml

      # Trusted Publishing: exchanges the workflow's OIDC token for a
      # short-lived crates.io token; no long-lived secret involved.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        working-directory: sdk/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python:
    if: startsWith(github.ref_name, 'sdk/python/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/python/v}"
          grep -q "^version = \"$ver\"$" sdk/python/pyproject.toml

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build
        working-directory: sdk/python
        run: uv build

      # uv detects PyPI Trusted Publishing from the Actions OIDC context.
      - name: Publish to PyPI
        working-directory: sdk/python
        run: uv publish

  go:
    if: startsWith(github.ref_name, 'sdk/go/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: sdk/go/go.mod

      - name: Verify module
        working-directory: sdk/go
        run: |
          go vet ./...
          go test ./...

      # Publishing a Go module IS the tag push; this just asks the module
      # proxy to fetch and index the new version so it is immediately usable.
      - name: Trigger proxy indexing
        run: |
          ver="${GITHUB_REF_NAME#sdk/go/}"
          GOPROXY=https://proxy.golang.org GONOSUMCHECK=1 \
            go mod download "github.com/nanocached/nanocached/sdk/go@$ver" || true
          curl -sf "https://proxy.golang.org/github.com/nanocached/nanocached/sdk/go/@v/$ver.info"

  java:
    if: startsWith(github.ref_name, 'sdk/java/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/java/v}"
          grep -q "^version = '$ver'$" sdk/java/build.gradle

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Publish to Maven Central
        working-directory: sdk/java
        run: gradle publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

  typescript:
    if: startsWith(github.ref_name, 'sdk/typescript/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/typescript/v}"
          test "$(node -p 'require("./sdk/typescript/package.json").version')" = "$ver"

      # pnpm version comes from the packageManager field in the SDK's package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: sdk/typescript/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      - run: npm install -g npm@latest

      # prepublishOnly runs test + build; npm publish authenticates via OIDC.
      - name: Build and publish to npm
        working-directory: sdk/typescript
        run: |
          pnpm install --frozen-lockfile
          npm publish --access public

  dotnet:
    if: startsWith(github.ref_name, 'sdk/dotnet/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.x

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/dotnet/v}"
          grep -q "<Version>$ver</Version>" sdk/dotnet/src/Nanocached/Nanocached.csproj

      # Trusted Publishing: exchanges the workflow's OIDC token for a
      # short-lived nuget.org API key; no long-lived secret involved.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: t0k0sh1

      - name: Pack and publish to NuGet
        working-directory: sdk/dotnet
        run: |
          ver="${GITHUB_REF_NAME#sdk/dotnet/v}"
          dotnet pack src/Nanocached/Nanocached.csproj -c Release -o out
          dotnet nuget push "out/Nanocached.$ver.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

  # ── framework adapters ──────────────────────────────────────────────
  # Every adapter is released at the same version as the SDK it sits on
  # (tools/release-all.sh pushes the SDK tags first), and its published
  # manifest depends on that SDK release — never on the sibling checkout
  # the repo builds against.

  adapter-npm:
    if: startsWith(github.ref_name, 'adapter/cache-manager/v') || startsWith(github.ref_name, 'adapter/keyv/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve adapter and version from the tag
        id: tag
        run: |
          rest="${GITHUB_REF_NAME#adapter/}"
          echo "name=${rest%/v*}" >> "$GITHUB_OUTPUT"
          echo "ver=${rest#*/v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        run: |
          test "$(node -p 'require("./adapters/${{ steps.tag.outputs.name }}/package.json").version')" = "${{ steps.tag.outputs.ver }}"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: adapters/${{ steps.tag.outputs.name }}/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      - run: npm install -g npm@latest

      # `pnpm install` links the sibling SDK checkout (the manifest's
      # `link:../../sdk/typescript`), which prepublishOnly's test + build
      # run against. The *published* manifest must depend on the SDK
      # release of the same version instead — a `link:` spec is
      # meaningless outside this repo — so the dependency is rewritten
      # right before `npm publish`; node_modules keeps the link.
      - name: Build and publish to npm
        working-directory: adapters/${{ steps.tag.outputs.name }}
        run: |
          pnpm install --frozen-lockfile
          npm pkg set "dependencies.nanocached=^${{ steps.tag.outputs.ver }}"
          npm publish --access public

  adapter-pypi:
    if: startsWith(github.ref_name, 'adapter/django/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#adapter/django/v}"
          grep -q "^version = \"$ver\"$" adapters/django/pyproject.toml
          grep -q "\"nanocached>=$ver\"" adapters/django/pyproject.toml

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build
        working-directory: adapters/django
        run: uv build

      # uv detects PyPI Trusted Publishing from the Actions OIDC context.
      - name: Publish to PyPI
        working-directory: adapters/django
        run: uv publish

  adapter-nuget:
    if: startsWith(github.ref_name, 'adapter/dotnet/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.x

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#adapter/dotnet/v}"
          grep -q "<Version>$ver</Version>" adapters/dotnet/src/Nanocached.Caching/Nanocached.Caching.csproj
          # The adapter's ProjectReference on the SDK becomes a package
          # dependency on Nanocached at the SDK project's version — which
          # must be this same version, or the package would depend on a
          # release that isn't this cycle's.
          grep -q "<Version>$ver</Version>" sdk/dotnet/src/Nanocached/Nanocached.csproj

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: t0k0sh1

      # `dotnet pack` packs the adapter only (the referenced SDK project is
      # built, not packed) and writes it as a dependency on Nanocached.
      - name: Pack and publish to NuGet
        working-directory: adapters/dotnet
        run: |
          ver="${GITHUB_REF_NAME#adapter/dotnet/v}"
          dotnet pack src/Nanocached.Caching/Nanocached.Caching.csproj -c Release -o out
          dotnet nuget push "out/Nanocached.Caching.$ver.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

  adapter-maven:
    if: startsWith(github.ref_name, 'adapter/spring/v') || startsWith(github.ref_name, 'adapter/jcache/v') || startsWith(github.ref_name, 'adapter/spring-boot-starter/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve adapter and version from the tag
        id: tag
        run: |
          rest="${GITHUB_REF_NAME#adapter/}"
          echo "name=${rest%/v*}" >> "$GITHUB_OUTPUT"
          echo "ver=${rest#*/v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        run: |
          grep -q "^version = '${{ steps.tag.outputs.ver }}'$" adapters/${{ steps.tag.outputs.name }}/build.gradle

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The adapter's settings.gradle includes the sibling SDK build (and,
      # for the starter, the spring adapter) so the build compiles against
      # the same commit; the generated POM still names the published
      # coordinates at this version.
      - name: Publish to Maven Central
        working-directory: adapters/${{ steps.tag.outputs.name }}
        run: gradle publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
