name: Release SDK

# Also releases the seven framework adapters (`adapter/<name>/v*` tags).
# They live in this same workflow file on purpose: the registries' Trusted
# Publishing policies (nuget.org, PyPI, npm) are bound to the workflow
# file name, so one file keeps one policy per registry.
on:
  push:
    tags:
      - 'sdk/*/v*'
      - 'adapter/*/v*'

permissions:
  contents: read

jobs:
  rust:
    if: startsWith(github.ref_name, 'sdk/rust/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/rust/v}"
          grep -q "^version = \"$ver\"$" sdk/rust/Cargo.toml

      # Trusted Publishing: exchanges the workflow's OIDC token for a
      # short-lived crates.io token; no long-lived secret involved.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish to crates.io
        working-directory: sdk/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python:
    if: startsWith(github.ref_name, 'sdk/python/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/python/v}"
          grep -q "^version = \"$ver\"$" sdk/python/pyproject.toml

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        working-directory: sdk/python
        run: uv build

      # uv detects PyPI Trusted Publishing from the Actions OIDC context.
      - name: Publish to PyPI
        working-directory: sdk/python
        run: uv publish

  go:
    if: startsWith(github.ref_name, 'sdk/go/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod

      - name: Verify module
        working-directory: sdk/go
        run: |
          go vet ./...
          go test ./...

      # Publishing a Go module IS the tag push; this just asks the module
      # proxy to fetch and index the new version so it is immediately usable.
      - name: Trigger proxy indexing
        run: |
          ver="${GITHUB_REF_NAME#sdk/go/}"
          GOPROXY=https://proxy.golang.org GONOSUMCHECK=1 \
            go mod download "github.com/nanocached/nanocached/sdk/go@$ver" || true
          curl -sf "https://proxy.golang.org/github.com/nanocached/nanocached/sdk/go/@v/$ver.info"

  java:
    if: startsWith(github.ref_name, 'sdk/java/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Maven Central credentials and the signing key live in the `release`
    # environment, which needs a reviewer's approval and only accepts the
    # release tags, so pushing a tag is not enough to reach them.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/java/v}"
          grep -q "^version = '$ver'$" sdk/java/build.gradle

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Publish to Maven Central
        working-directory: sdk/java
        run: gradle publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

  typescript:
    if: startsWith(github.ref_name, 'sdk/typescript/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/typescript/v}"
          test "$(node -p 'require("./sdk/typescript/package.json").version')" = "$ver"

      # pnpm version comes from the packageManager field in the SDK's package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/typescript/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      # Pinned, not `@latest`: this job holds `id-token: write`, and every
      # other tool in these workflows is pinned. Dependabot does not see a
      # global install in a workflow, so bump the version here by hand.
      - run: npm install -g npm@12.2.1

      # prepublishOnly runs test + build; npm publish authenticates via OIDC.
      - name: Build and publish to npm
        working-directory: sdk/typescript
        run: |
          pnpm install --frozen-lockfile
          npm publish --access public

  dotnet:
    if: startsWith(github.ref_name, 'sdk/dotnet/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#sdk/dotnet/v}"
          grep -q "<Version>$ver</Version>" sdk/dotnet/src/Nanocached/Nanocached.csproj

      # Trusted Publishing: exchanges the workflow's OIDC token for a
      # short-lived nuget.org API key; no long-lived secret involved.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: t0k0sh1

      - name: Pack and publish to NuGet
        working-directory: sdk/dotnet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          ver="${GITHUB_REF_NAME#sdk/dotnet/v}"
          dotnet pack src/Nanocached/Nanocached.csproj -c Release -o out
          dotnet nuget push "out/Nanocached.$ver.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

  # ── framework adapters ──────────────────────────────────────────────
  # Every adapter is released at the same version as the SDK it sits on
  # (tools/release-all.sh pushes the SDK tags first), and its published
  # manifest depends on that SDK release — never on the sibling checkout
  # the repo builds against.

  adapter-npm:
    if: startsWith(github.ref_name, 'adapter/cache-manager/v') || startsWith(github.ref_name, 'adapter/keyv/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve adapter and version from the tag
        id: tag
        run: |
          rest="${GITHUB_REF_NAME#adapter/}"
          name="${rest%/v*}"
          ver="${rest#*/v}"
          # A tag name may hold shell syntax (`git check-ref-format` accepts
          # `adapter/keyv/v1";id${IFS}x;"`), so nothing later may see a
          # value that has not passed this check.
          if ! printf '%s' "$name" | grep -Eq '^(cache-manager|keyv)$'; then
            echo "::error::'$name' is not an adapter this job releases"
            exit 1
          fi
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::'$ver' is not a version (X.Y.Z or X.Y.Z-pre)"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VER: ${{ steps.tag.outputs.ver }}
        run: |
          test "$(node -p 'require("./adapters/" + process.env.NAME + "/package.json").version')" = "$VER"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: adapters/${{ steps.tag.outputs.name }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      # Pinned, not `@latest`: this job holds `id-token: write`, and every
      # other tool in these workflows is pinned. Dependabot does not see a
      # global install in a workflow, so bump the version here by hand.
      - run: npm install -g npm@12.2.1

      # `pnpm install` links the sibling SDK checkout (the manifest's
      # `link:../../sdk/typescript`), which the test + build run against.
      # The *published* manifest must depend on the SDK release of the
      # same version instead — a `link:` spec is meaningless outside this
      # repo — so the dependency is rewritten after test + build and right
      # before `npm publish`. The rewrite makes package.json disagree with
      # pnpm-lock.yaml, and pnpm 11 refuses to `pnpm run` anything in that
      # state (ERR_PNPM_OUTDATED_LOCKFILE — this is what failed the first
      # 0.4.4 attempt), so test + build run first and the publish skips
      # prepublishOnly (which would re-run them) with --ignore-scripts.
      - name: Build and publish to npm
        working-directory: adapters/${{ steps.tag.outputs.name }}
        env:
          VER: ${{ steps.tag.outputs.ver }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          npm pkg set "dependencies.nanocached=^$VER"
          npm publish --access public --ignore-scripts

  adapter-pypi:
    if: startsWith(github.ref_name, 'adapter/django/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#adapter/django/v}"
          grep -q "^version = \"$ver\"$" adapters/django/pyproject.toml
          grep -q "\"nanocached>=$ver\"" adapters/django/pyproject.toml

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        working-directory: adapters/django
        run: uv build

      # uv detects PyPI Trusted Publishing from the Actions OIDC context.
      - name: Publish to PyPI
        working-directory: adapters/django
        run: uv publish

  adapter-nuget:
    if: startsWith(github.ref_name, 'adapter/dotnet/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#adapter/dotnet/v}"
          grep -q "<Version>$ver</Version>" adapters/dotnet/src/Nanocached.Caching/Nanocached.Caching.csproj
          # The adapter's ProjectReference on the SDK becomes a package
          # dependency on Nanocached at the SDK project's version — which
          # must be this same version, or the package would depend on a
          # release that isn't this cycle's.
          grep -q "<Version>$ver</Version>" sdk/dotnet/src/Nanocached/Nanocached.csproj

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: t0k0sh1

      # `dotnet pack` packs the adapter only (the referenced SDK project is
      # built, not packed) and writes it as a dependency on Nanocached.
      - name: Pack and publish to NuGet
        working-directory: adapters/dotnet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          ver="${GITHUB_REF_NAME#adapter/dotnet/v}"
          dotnet pack src/Nanocached.Caching/Nanocached.Caching.csproj -c Release -o out
          dotnet nuget push "out/Nanocached.Caching.$ver.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

  adapter-maven:
    if: startsWith(github.ref_name, 'adapter/spring/v') || startsWith(github.ref_name, 'adapter/jcache/v') || startsWith(github.ref_name, 'adapter/spring-boot-starter/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Maven Central credentials and the signing key live in the `release`
    # environment, which needs a reviewer's approval and only accepts the
    # release tags, so pushing a tag is not enough to reach them.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve adapter and version from the tag
        id: tag
        run: |
          rest="${GITHUB_REF_NAME#adapter/}"
          name="${rest%/v*}"
          ver="${rest#*/v}"
          # A tag name may hold shell syntax (`git check-ref-format` accepts
          # `adapter/keyv/v1";id${IFS}x;"`), so nothing later may see a
          # value that has not passed this check.
          if ! printf '%s' "$name" | grep -Eq '^(spring|jcache|spring-boot-starter)$'; then
            echo "::error::'$name' is not an adapter this job releases"
            exit 1
          fi
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::'$ver' is not a version (X.Y.Z or X.Y.Z-pre)"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VER: ${{ steps.tag.outputs.ver }}
        run: |
          grep -q "^version = '$VER'$" "adapters/$NAME/build.gradle"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The adapter's settings.gradle includes the sibling SDK build (and,
      # for the starter, the spring adapter) so the build compiles against
      # the same commit; the generated POM still names the published
      # coordinates at this version.
      - name: Publish to Maven Central
        working-directory: adapters/${{ steps.tag.outputs.name }}
        run: gradle publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
