name: Release server

on:
  push:
    tags:
      - 'server/v*'

permissions:
  contents: read
  packages: write

jobs:
  # One job per image builds and pushes `:X.Y.Z`. `:latest` is not touched
  # here: it is moved by the `latest` job below, once, for all three images,
  # and only after every build has succeeded — a job that pushed its own
  # `:latest` left the three images on different releases whenever one
  # matrix job failed (an arm64 build hitting the timeout) and the others
  # were cancelled or had already pushed.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        component: [node, discovery, proxy]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches manifest version
        id: ver
        run: |
          ver="${GITHUB_REF_NAME#server/v}"
          grep -q "^version = \"$ver\"$" Cargo.toml
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ steps.ver.outputs.ver }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.ver }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # `:latest` for the three images in one step, after all three `:X.Y.Z`
  # pushes succeeded. Skipped for a pre-release version (one with a `-`)
  # and when the registry's `:latest` already carries a newer version: a
  # re-run of an older tag's workflow, or a tag pushed out of order, must
  # not move `:latest` backwards. The comparison reads the
  # `org.opencontainers.image.version` label the build step writes.
  latest:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Move :latest for all three images
        env:
          REPO: ghcr.io/${{ github.repository }}
          VER: ${{ github.ref_name }}
        run: |
          ver="${VER#server/v}"
          # The version `:latest` points at now, from the node image's
          # label (a multi-platform image: `.Image` is keyed by platform).
          # Empty when there is no `:latest` yet or it carries no label,
          # as a build of `main` from before 0.6.0 does; empty means retag.
          current=$(docker buildx imagetools inspect "$REPO-node:latest" --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null || true)
          current=$(printf '%s' "$current" | tr -d '[:space:]')
          if [ -n "$current" ] && [ "$current" != "$ver" ] && [ "$(printf '%s\n%s\n' "$current" "$ver" | sort -V | tail -n1)" = "$current" ]; then
            echo "::notice:::latest is $current, newer than $ver; leaving it"
            exit 0
          fi
          for component in node discovery proxy; do
            docker buildx imagetools create -t "$REPO-$component:latest" "$REPO-$component:$ver"
          done
