name: Release server

on:
  push:
    tags:
      - 'server/v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        component: [node, discovery]

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches manifest version
        id: ver
        run: |
          ver="${GITHUB_REF_NAME#server/v}"
          grep -q "^version = \"$ver\"$" Cargo.toml
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ steps.ver.outputs.ver }}
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.ver }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
