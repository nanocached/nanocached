name: Release server

on:
  push:
    tags:
      - 'server/v*'
  # Re-point `:latest` for the three images without publishing anything:
  # only the `latest` job runs (see below).
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to point :latest at, e.g. 0.6.0 (server/v0.6.0 and v0.6.0
          are accepted too). Empty: the newest stable server/v* tag.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # One job per image builds and pushes `:X.Y.Z`. `:latest` is not touched
  # here: it is moved by the `latest` job below, once, for all three images,
  # and only after every build has succeeded — a job that pushed its own
  # `:latest` left the three images on different releases whenever one
  # matrix job failed (an arm64 build hitting the timeout) and the others
  # were cancelled or had already pushed.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A manual run only moves `:latest`; it never builds or pushes `:X.Y.Z`.
    if: ${{ github.event_name == 'push' }}

    strategy:
      matrix:
        component: [node, discovery, proxy]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches manifest version
        id: ver
        run: |
          ver="${GITHUB_REF_NAME#server/v}"
          grep -q "^version = \"$ver\"$" Cargo.toml
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ steps.ver.outputs.ver }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.ver }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # `:latest` for the three images in one step, after all three `:X.Y.Z`
  # pushes succeeded. Skipped for a pre-release version (one with a `-`)
  # and when the registry's `:latest` already carries a newer version: a
  # re-run of an older tag's workflow, or a tag pushed out of order, must
  # not move `:latest` backwards. The comparison reads the
  # `org.opencontainers.image.version` label the build step writes.
  #
  # Also the manual entry point (`workflow_dispatch`) for repairing the
  # registry when the three `:latest` disagree: `publish` is skipped then,
  # so the job accepts a skipped `publish` for a manual run only, and takes
  # the version from the input (default: the newest stable `server/v*` tag)
  # instead of the ref name, which is a branch for a manual run. The
  # pre-release check moves into the version step for the same reason.
  latest:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push'
          && needs.publish.result == 'success'
          && !contains(github.ref_name, '-'))
        ||
        (github.event_name == 'workflow_dispatch'
          && needs.publish.result == 'skipped')
      ) }}

    steps:
      - name: Resolve the version to point :latest at
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ github.repository }}
        run: |
          if [ "$EVENT" = push ]; then
            ver="${REF_NAME#server/v}"
          else
            ver="${INPUT_VERSION#server/}"
            ver="${ver#v}"
            if [ -z "$ver" ]; then
              ver=$(gh api --paginate "repos/$SLUG/git/matching-refs/tags/server/v" --jq '.[].ref' \
                | sed 's#^refs/tags/server/v##' \
                | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
                | sort -V | tail -n1)
            fi
            # A manual run is held to the same rule as the tag path: a
            # pre-release (or anything that is not X.Y.Z) never becomes `:latest`.
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$ver' is not a stable X.Y.Z version (input: '${INPUT_VERSION}')"
              exit 1
            fi
          fi
          echo "Pointing :latest at $ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Move :latest for all three images
        env:
          REPO: ghcr.io/${{ github.repository }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          ver="$VER"
          # All three `:X.Y.Z` must exist before any `:latest` moves: a
          # manual run can name a version whose build never finished, and
          # failing half-way would leave the images on different releases.
          for component in node discovery proxy; do
            docker buildx imagetools inspect "$REPO-$component:$ver" > /dev/null
          done
          # The version `:latest` points at now, from the node image's
          # label (a multi-platform image: `.Image` is keyed by platform).
          # Empty when there is no `:latest` yet or it carries no label,
          # as a build of `main` from before 0.6.0 does; empty means retag.
          current=$(docker buildx imagetools inspect "$REPO-node:latest" --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null || true)
          current=$(printf '%s' "$current" | tr -d '[:space:]')
          if [ -n "$current" ] && [ "$current" != "$ver" ] && [ "$(printf '%s\n%s\n' "$current" "$ver" | sort -V | tail -n1)" = "$current" ]; then
            echo "::notice:::latest is $current, newer than $ver; leaving it"
            exit 0
          fi
          for component in node discovery proxy; do
            docker buildx imagetools create -t "$REPO-$component:latest" "$REPO-$component:$ver"
          done
