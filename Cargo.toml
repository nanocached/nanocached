[package]
name = "kvelo"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
bytes = "1"
rustc-hash = "2"
tokio = {
  version = "1",
  features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"]
}

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
all = "deny"
