[package]
name = "nanocached"
version = "0.3.0"
license = "MIT"
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "nanocached-node"
path = "src/main.rs"

[dependencies]
bytes = "1"
lru = "0.18"
rustc-hash = "2"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
sha2 = "0.10"
tokio = {
  version = "1",
  features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]
}
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14.9"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
all = "deny"
