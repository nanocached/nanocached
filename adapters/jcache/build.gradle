plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'com.diffplug.spotless' version '8.12.0'
}

group = 'org.nanocached'
version = '0.6.2'

mavenPublishing {
    // The release does not use this task: CI publishes the four Maven
    // modules together as one Central Portal deployment
    // (tools/maven-central-bundle.gradle, tools/central-portal-upload.sh),
    // and running it here would spend a release event on this module alone.
    publishToMavenCentral(true)
    signAllPublications()
    coordinates('org.nanocached', 'nanocached-jcache', version.toString())
    pom {
        name = 'nanocached-jcache'
        description = 'JCache (JSR-107) provider for the nanocached Java SDK'
        url = 'https://nanocached.org'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/nanocached/nanocached/blob/main/LICENSE'
            }
        }
        developers {
            developer {
                id = 't0k0sh1'
                name = 'Takashi Yamashina'
            }
        }
        scm {
            url = 'https://github.com/nanocached/nanocached'
            connection = 'scm:git:git://github.com/nanocached/nanocached.git'
            developerConnection = 'scm:git:ssh://git@github.com/nanocached/nanocached.git'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// `./gradlew spotlessApply` rewrites sources; `spotlessCheck` (part of
// `check`) fails on drift. palantir-java-format is google-java-format's fork
// with 4-space indentation, 120 columns and lambda/chain wrapping that does
// not drift to the right.
spotless {
    java {
        palantirJavaFormat('2.103.0')
    }
    groovyGradle {
        // Eclipse's defaults indent with tabs; .editorconfig says 4 spaces.
        greclipse('4.41').configProperties('''
            org.eclipse.jdt.core.formatter.tabulation.char=space
            org.eclipse.jdt.core.formatter.tabulation.size=4
        ''')
    }
}

// Any javac warning fails the build, in main and test sources alike.
// -serial: classes here are Serializable because JSR-107 or EventObject
// requires it (expiry policies, listeners, entry events); none promises a
// stable serialized form, so a serialVersionUID on each would be noise.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '-Xlint:all',
        '-Xlint:-serial',
        '-Werror'
    ]
    options.encoding = 'UTF-8'
}

// The Javadoc ships in the -javadoc jar, so doclint errors (broken links and
// references, malformed HTML) fail `check`. `missing` stays off, as CS1591 in
// the .NET build: a @param/@return on every self-explanatory member is noise.
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addBooleanOption('Werror', true)
}
tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

repositories {
    mavenCentral()
}

dependencies {
    // The SDK the adapter is built on. `api`: NanocachedClient appears in
    // the adapter's public construction API.
    api 'org.nanocached:nanocached:0.6.2'
    // The JCache SPI this module implements. `api`: javax.cache types
    // (Cache, CacheManager, Configuration, ...) appear throughout this
    // module's own public API.
    api 'javax.cache:cache-api:1.1.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
