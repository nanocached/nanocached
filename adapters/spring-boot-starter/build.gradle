plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'com.diffplug.spotless' version '8.12.0'
}

group = 'org.nanocached'
version = '0.6.2'

mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates('org.nanocached', 'nanocached-spring-boot-starter', version.toString())
    pom {
        name = 'nanocached-spring-boot-starter'
        description = 'Spring Boot autoconfiguration for the nanocached-spring Cache adapter'
        url = 'https://nanocached.org'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/nanocached/nanocached/blob/main/LICENSE'
            }
        }
        developers {
            developer {
                id = 't0k0sh1'
                name = 'Takashi Yamashina'
            }
        }
        scm {
            url = 'https://github.com/nanocached/nanocached'
            connection = 'scm:git:git://github.com/nanocached/nanocached.git'
            developerConnection = 'scm:git:ssh://git@github.com/nanocached/nanocached.git'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// `./gradlew spotlessApply` rewrites sources; `spotlessCheck` (part of
// `check`) fails on drift. palantir-java-format is google-java-format's fork
// with 4-space indentation, 120 columns and lambda/chain wrapping that does
// not drift to the right.
spotless {
    java {
        palantirJavaFormat('2.103.0')
    }
    groovyGradle {
        // Eclipse's defaults indent with tabs; .editorconfig says 4 spaces.
        greclipse('4.41').configProperties('''
            org.eclipse.jdt.core.formatter.tabulation.char=space
            org.eclipse.jdt.core.formatter.tabulation.size=4
        ''')
    }
}

// Any javac warning fails the build, in main and test sources alike.
// -processing: spring-boot-configuration-processor only generates property
// metadata and claims no annotations, which javac reports as a warning.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '-Xlint:all',
        '-Xlint:-processing',
        '-Werror'
    ]
    options.encoding = 'UTF-8'
}

// The Javadoc ships in the -javadoc jar, so doclint errors (broken links and
// references, malformed HTML) fail `check`. `missing` stays off, as CS1591 in
// the .NET build: a @param/@return on every self-explanatory member is noise.
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addBooleanOption('Werror', true)
}
tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

repositories {
    mavenCentral()
}

dependencies {
    // A starter is a dependency aggregator: pulling this in is meant to be
    // the only nanocached-related dependency a Boot app needs, so both the
    // adapter and Boot's own autoconfigure/base starter are `api`.
    api 'org.nanocached:nanocached-spring:0.6.2'
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    api 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // The Boot-interaction tests boot a real ApplicationContext (yaml-only
    // and Java-config back-off cases) plus a Redis starter as the
    // competing autoconfigured backend, same as nanocached-spring's own
    // BootAutoConfigurationInteractionTest.
    testImplementation 'org.springframework.boot:spring-boot-starter-cache'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// SpEL keys that name method parameters need parameter names in the class
// files, same as nanocached-spring's own build.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-parameters'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
