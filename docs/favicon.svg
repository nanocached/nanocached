<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d4f5"/>
      <stop offset="1" stop-color="#1e5fe0"/>
    </linearGradient>
  </defs>
  <!-- Pointy-top hexagon, rounded corners via stroke-linejoin -->
  <polygon points="256,40 442,148 442,364 256,472 70,364 70,148"
           fill="url(#hex)" stroke="url(#hex)" stroke-width="40"
           stroke-linejoin="round"/>
  <!-- Bold up-right arrow, drawn pointing right then rotated -45° -->
  <g transform="rotate(-45 256 256)">
    <path d="M 76 226 L 280 226 L 280 140 L 436 256 L 280 372 L 280 286 L 76 286 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="16"
          stroke-linejoin="round"/>
  </g>
</svg>
