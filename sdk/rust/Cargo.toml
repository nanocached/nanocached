[package]
name = "nanocached"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Async client SDK for nanocached, a tiny distributed cache with client-side replication"
license = "MIT"
homepage = "https://nanocached.org"
repository = "https://github.com/nanocached/nanocached"
keywords = ["nanocached", "cache", "distributed", "client", "sdk"]
categories = ["caching", "asynchronous"]

# Standalone crate: stop Cargo from walking up to the repo-root
# `Cargo.toml` (the server) in search of a workspace. Besides keeping the
# two builds independent, older Cargo (the MSRV checked in CI) cannot
# even parse the root manifest's newer TOML syntax.
[workspace]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# Value compression: pure-Rust backend (no C toolchain), matching why
# rustls's `ring` backend was chosen for `tls` (TLS support) — keeps the
# cross-compiled build story intact.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }

[features]
default = ["tls", "compression"]
tls = [
  "dep:tokio-rustls",
  "dep:rustls-pki-types",
  "dep:rustls-pemfile",
  "dep:rustls-native-certs",
]
compression = ["dep:flate2"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
